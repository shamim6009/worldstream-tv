[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback (prerendered files are served first because force is false).
[[redirects]]
  from = "/bangladesh"
  to = "/bangladesh-tv"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
